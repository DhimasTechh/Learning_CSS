<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }

      form {
        width: 300px;
        border: 1px solid teal;
        margin: 40px auto;
        padding: 20px;
        border-radius: 10px;
        background-color: lightcyan;
      }

      input {
        display: block;
        width: 100%;
        height: 28px;
        padding: 5px;
        margin-top: 20px;
        box-sizing: border-box;
      }
      /* style register */
      form p{
        margin-top: 10px;
        font-size: 13px;
      }

      form p a{
        text-decoration: none;
      }
      form p a:hover{
        background-color: lightgreen;
      color: black;
      }
      
      /* style buttnon */

      button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
      }

      button:hover {
        color: black;
        background-color: lightgreen;
      }
      
      
    </style>
  </head>
  <body>
    <!-- membuat form tag form -->
    <form action="">
      <h3>Login</h3>

      <input type="text" placeholder="Username" />
      <input type="password" placeholder="Password" />
      <button type="submit">Login</button>

      <p class="register">Belum Punya Akun? <a href="#">Daftar disini</a></p>
    </form>

  </body>
</html>
